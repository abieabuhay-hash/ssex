  <audio id="ssexTrack" src="media/tonyhawk.mp3"></audio>

  <script>
    (function () {
      var main = document.getElementById('mainContent');
      var intro = document.getElementById('intro');
      var enterButton = document.getElementById('enterButton');
      var audio = document.getElementById('ssexTrack');
      var titleEl = document.getElementById('trackTitle');
      var btnPrev = document.getElementById('prevTrack');
      var btnPlay = document.getElementById('playPause');
      var btnNext = document.getElementById('nextTrack');
      var btnShuffle = document.getElementById('shuffleToggle');
      var priceEth = document.getElementById('priceEth');
      var priceXmr = document.getElementById('priceXmr');
      var priceSol = document.getElementById('priceSol');

      var tracks = [
        { src: 'media/tonyhawk.mp3',        name: 'tonyhawk.mp3' },
        { src: 'media/drankdrank.mp3',      name: 'drankdrank.mp3' },
        { src: 'media/EARDRUMMER.mp3',      name: 'EARDRUMMER.mp3' },
        { src: 'media/Santa.mp3',           name: 'Santa.mp3' },
        { src: 'media/BeverlyHills.mp3',    name: 'BeverlyHills.mp3' },
        { src: 'media/Supposed2BeHere.mp3', name: 'Supposed2BeHere.mp3' },
        { src: 'media/Bands.mp3',           name: 'Bands.mp3' },
        { src: 'media/F_CKCANCER.mp3',      name: 'F_CKCANCER.mp3' },
        { src: 'media/Outro.mp3',           name: 'Outro.mp3' },
        { src: 'media/Weekend.mp3',         name: 'Weekend.mp3' }
      ];
      var currentIndex = 0;
      var isPlaying = false;
      var shuffle = false;

      function loadTrack(index) {
        if (!audio || !tracks.length) return;
        currentIndex = (index + tracks.length) % tracks.length;
        audio.src = tracks[currentIndex].src;
        if (titleEl) titleEl.textContent = tracks[currentIndex].name;
      }

      function updatePlayIcon() {
        if (!btnPlay) return;
        btnPlay.innerHTML = isPlaying ? '&#10074;&#10074;' : '&#9658;';
      }

      function playCurrent() {
        if (!audio) return;
        var p = audio.play();
        if (p && p.then) {
          p.then(function () {
            isPlaying = true;
            updatePlayIcon();
          }).catch(function () { /* ignore */ });
        } else {
          isPlaying = true;
          updatePlayIcon();
        }
      }

      function pauseCurrent() {
        if (!audio) return;
        audio.pause();
        isPlaying = false;
        updatePlayIcon();
      }

      function nextTrack() {
        if (!tracks.length) return;
        if (shuffle && tracks.length > 1) {
          var next = currentIndex;
          while (next === currentIndex) {
            next = Math.floor(Math.random() * tracks.length);
          }
          loadTrack(next);
        } else {
          loadTrack(currentIndex + 1);
        }
        playCurrent();
      }

      function prevTrack() {
        if (!tracks.length) return;
        loadTrack(currentIndex - 1);
        playCurrent();
      }

      
      var startIndex = tracks.length ? Math.floor(Math.random() * tracks.length) : 0;
      loadTrack(startIndex);
      updatePlayIcon();

      if (btnPlay) {
        btnPlay.addEventListener('click', function () {
          if (!audio) return;
          if (isPlaying) {
            pauseCurrent();
          } else {
            playCurrent();
          }
        });
      }

      if (btnNext) {
        btnNext.addEventListener('click', nextTrack);
      }

      if (btnPrev) {
        btnPrev.addEventListener('click', prevTrack);
      }

      if (btnShuffle) {
        btnShuffle.addEventListener('click', function () {
          shuffle = !shuffle;
          btnShuffle.classList.toggle('bg-zinc-800/80', shuffle);
          btnShuffle.classList.toggle('border-zinc-300', shuffle);
          btnShuffle.classList.toggle('text-zinc-200', shuffle);

         
          if (shuffle && tracks.length > 1) {
            nextTrack();
          }
        });
      }

      // fetch live prices (initial + live updates)
      function setPrice(el, value) {
        if (!el) return;
        var formatted = '$' + value.toLocaleString();
        if (el.textContent !== formatted) {
          el.textContent = formatted;
          el.classList.add('text-zinc-100');
          el.style.transition = 'transform 120ms ease-out, color 120ms ease-out';
          el.style.transform = 'translateY(-1px)';
          setTimeout(function () {
            el.classList.remove('text-zinc-100');
            el.style.transform = '';
          }, 140);
        }
      }

      function fetchPrices() {
        if (!(priceEth || priceXmr || priceSol)) return;
        fetch('https://api.coingecko.com/api/v3/simple/price?ids=ethereum,monero,solana&vs_currencies=usd')
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (priceEth && data.ethereum && data.ethereum.usd != null) {
              setPrice(priceEth, data.ethereum.usd);
            }
            if (priceXmr && data.monero && data.monero.usd != null) {
              setPrice(priceXmr, data.monero.usd);
            }
            if (priceSol && data.solana && data.solana.usd != null) {
              setPrice(priceSol, data.solana.usd);
            }
          })
          .catch(function () {
            // leave placeholders on error
          });
      }

      fetchPrices();
      setInterval(fetchPrices, 15000);

      if (audio) {
        audio.addEventListener('ended', function () {
          nextTrack();
        });
      }

   
      if (enterButton) {
        enterButton.addEventListener('click', function () {
          if (intro) {
            intro.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(function () {
              intro.style.display = 'none';
            }, 400);
          }

          if (main) {
            main.classList.remove('opacity-0', 'pointer-events-none');
          }

          playCurrent();
        });
      }

     
      var cur = document.getElementById('custom-cursor');
      var trail = document.getElementById('cursor-trail');
      var lastTrail = 0;
      var trailThrottle = 8;

      document.addEventListener('mousemove', function (e) {
        if (cur) {
          cur.style.left = e.clientX - 20 + 'px';
          cur.style.top = e.clientY - 20 + 'px';
        }

        var now = Date.now();
        if (now - lastTrail < trailThrottle) return;
        lastTrail = now;

        if (trail) {
          var dot = document.createElement('div');
          dot.className = 'cursor-trail';
          dot.style.left = (e.clientX - 4) + 'px';
          dot.style.top = (e.clientY - 4) + 'px';
          trail.appendChild(dot);
          setTimeout(function () { dot.remove(); }, 800);
        }
      });
    })();
  </script>
